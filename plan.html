<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan treningowy · Fitness Flow</title>
<meta name="description" content="Plan treningowy od znajomego – otwórz go w aplikacji Fitness Flow.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!--
  Plan od znajomego (PlanShare w aplikacji). Ustawienia są w części po „#”, więc nie trafiają na serwer.
  „Otwórz w aplikacji” = intent:// do fitnessflow://plan?<to samo>; bez aplikacji – ta strona z ?noapp=1.
-->
<style>
  :root {
    --bg: #1E1E25; --card: #2D2D36; --card2: #3A3A45;
    --text: #F3F3F3; --text2: #BABABA; --text3: #8C8C96;
    --accent: #D5FF5F; --on-accent: #1E1E25;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 460px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text2); font-weight: 600; font-size: 14px; }
  .brand img { width: 28px; height: 28px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 22px 0 6px; letter-spacing: -0.01em; }
  .lead { color: var(--text2); margin: 0 0 20px; font-size: 15px; }
  .card { background: var(--card); border-radius: 28px; padding: 20px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--card2); font-size: 15px; }
  .row:last-child { border-bottom: 0; }
  .row span:first-child { color: var(--text3); flex: 0 0 auto; }
  .row span:last-child { text-align: right; font-weight: 600; }
  .note { color: var(--text3); font-size: 13px; margin: 14px 4px 0; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 56px; margin-top: 18px; border-radius: 999px;
    font: inherit; font-weight: 700; font-size: 16px; text-decoration: none; border: 0; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.secondary { background: var(--card2); color: var(--text); margin-top: 10px; }
  .alert { background: var(--card2); border-radius: 20px; padding: 14px 16px; margin-top: 18px; font-size: 14px; color: var(--text2); }
  .alert b { color: var(--text); }
  .steps { margin: 8px 0 0; padding-left: 20px; color: var(--text2); font-size: 14px; }
  .steps li { margin: 4px 0; }
  .hidden { display: none; }
  .error h1 { font-size: 22px; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="favicon.svg" alt="">Fitness Flow</div>

  <section id="plan" class="hidden">
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="card" id="rows"></div>
    <p class="note" id="note"></p>

    <div class="alert hidden" id="noapp"></div>

    <a class="btn primary" id="open" href="#"></a>
    <a class="btn secondary" id="get" href="https://github.com/CjxPL/fitnessflow-releases/releases/latest"></a>
    <ol class="steps" id="steps"></ol>
  </section>

  <section id="broken" class="hidden error">
    <h1 id="brokenTitle"></h1>
    <p class="lead" id="brokenText"></p>
    <a class="btn secondary" id="home" href="./"></a>
  </section>
</main>

<script>
(function () {
  var pl = (new URLSearchParams(location.search).get('lang') || navigator.language || 'pl').toLowerCase().indexOf('pl') === 0;
  document.documentElement.lang = pl ? 'pl' : 'en';
  var T = pl ? {
    title: 'Plan treningowy', titleFrom: 'Plan od: ',
    lead: 'Ten sam plan, a trudność ćwiczeń dopasuje się do Twojego poziomu.',
    type: 'Rodzaj', cali: 'Kalistenika', starter: 'Start od zera', goal: 'Cel', days: 'Dni w tygodniu',
    time: 'Czas treningu', auto: 'wg poziomu', skills: 'Elementy', gear: 'Sprzęt', none: 'bez sprzętu', weight: 'obciążenie',
    cardio: 'Cardio', knees: 'Bez skoków (kolana)', yes: 'tak',
    note: 'Link niesie tylko ustawienia planu – bez historii, wyników i danych o zdrowiu.',
    open: 'Otwórz w aplikacji', get: 'Nie masz aplikacji? Pobierz Fitness Flow',
    steps: ['Pobierz i zainstaluj aplikację (Android).', 'Wróć do tej strony i dotknij „Otwórz w aplikacji”.', 'Wybierz swój poziom i „Ćwicz tym planem”.'],
    noapp: '<b>Nie znaleźliśmy aplikacji na tym telefonie.</b> Zainstaluj ją, a potem wróć tutaj i otwórz plan jeszcze raz.',
    desktop: '<b>Otwórz ten link na telefonie z Androidem</b> – tam plan wczyta się do aplikacji jednym dotknięciem.',
    brokenTitle: 'Nie da się odczytać planu', brokenText: 'Link jest niepełny albo uszkodzony. Poproś znajomego, żeby wysłał go jeszcze raz z aplikacji (Trener → Wyślij plan znajomemu).',
    home: 'Zobacz Fitness Flow',
    focus: { HYPERTROPHY: 'Masa mięśniowa', ENDURANCE: 'Wytrzymałość', SKILLS: 'Elementy' },
    eq: { BAR: 'drążek', RINGS: 'kółka gimnastyczne', DIP_BARS: 'poręcze do dipów', PARALLETTES: 'paraletki', BAND: 'guma oporowa', POLE: 'pionowy słup / drabinki' },
    sk: { FRONT_LEVER: 'Front lever', BACK_LEVER: 'Back lever', PLANCHE: 'Planche', HANDSTAND: 'Stanie na rękach', MUSCLE_UP: 'Muscle-up', HUMAN_FLAG: 'Human flag', L_SIT: 'L-sit / V-sit', ONE_ARM_PULLUP: 'Podciąganie na jednej ręce' },
    cd: { BOTH: 'skakanka i bieg', JUMPROPE: 'skakanka', RUN: 'bieg', NONE: 'bez cardio' },
    wd: ['pn', 'wt', 'śr', 'cz', 'pt', 'sb', 'nd']
  } : {
    title: 'Training plan', titleFrom: 'Plan from ',
    lead: 'The same plan – exercise difficulty will match your level.',
    type: 'Type', cali: 'Calisthenics', starter: 'Start from zero', goal: 'Goal', days: 'Days a week',
    time: 'Session length', auto: 'by level', skills: 'Skills', gear: 'Equipment', none: 'none', weight: 'weight',
    cardio: 'Cardio', knees: 'No jumps (knees)', yes: 'yes',
    note: 'The link carries plan settings only – no history, results or health data.',
    open: 'Open in the app', get: 'No app yet? Get Fitness Flow',
    steps: ['Download and install the app (Android).', 'Come back to this page and tap “Open in the app”.', 'Pick your level and “Train with this plan”.'],
    noapp: '<b>We couldn’t find the app on this phone.</b> Install it, then come back here and open the plan again.',
    desktop: '<b>Open this link on an Android phone</b> – the plan loads into the app with one tap.',
    brokenTitle: 'Can’t read this plan', brokenText: 'The link is incomplete or damaged. Ask your friend to send it again from the app (Coach → Send your plan to a friend).',
    home: 'See Fitness Flow',
    focus: { HYPERTROPHY: 'Muscle growth', ENDURANCE: 'Endurance', SKILLS: 'Skills' },
    eq: { BAR: 'pull-up bar', RINGS: 'gymnastic rings', DIP_BARS: 'dip bars', PARALLETTES: 'parallettes', BAND: 'resistance band', POLE: 'vertical pole' },
    sk: { FRONT_LEVER: 'Front lever', BACK_LEVER: 'Back lever', PLANCHE: 'Planche', HANDSTAND: 'Handstand', MUSCLE_UP: 'Muscle-up', HUMAN_FLAG: 'Human flag', L_SIT: 'L-sit / V-sit', ONE_ARM_PULLUP: 'One-arm pull-up' },
    cd: { BOTH: 'jump rope and running', JUMPROPE: 'jump rope', RUN: 'running', NONE: 'no cardio' },
    wd: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
  };

  var $ = function (id) { return document.getElementById(id); };
  var raw = location.hash.replace(/^#/, '');
  var q = {};
  raw.split('&').forEach(function (p) {
    var i = p.indexOf('=');
    if (i > 0) { try { q[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' ')); } catch (e) {} }
  });

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function list(k, map) { return (q[k] || '').split(',').filter(function (x) { return map[x]; }).map(function (x) { return map[x]; }); }

  if (!q.v || (q.t !== 'c' && q.t !== 's')) {
    $('broken').classList.remove('hidden');
    $('brokenTitle').textContent = T.brokenTitle;
    $('brokenText').textContent = T.brokenText;
    $('home').textContent = T.home;
    $('home').href = './?lang=' + (pl ? 'pl' : 'en');
    return;
  }

  var name = (q.n || '').slice(0, 30);
  document.title = (name ? T.titleFrom + name : T.title) + ' · Fitness Flow';
  $('title').textContent = name ? T.titleFrom + name : T.title;
  $('lead').textContent = T.lead;

  var days = (q.wd || '').split(',').map(function (e) { return parseInt(e.split('.').pop(), 10); })
    .filter(function (d) { return d >= 0 && d <= 6; }).sort();
  var dayText = (q.d || '?') + (days.length ? ' (' + days.map(function (d) { return T.wd[d]; }).join(', ') + ')' : '');

  var rows = [];
  if (q.t === 'c') {
    rows.push([T.type, T.cali]);
    if (T.focus[q.f]) rows.push([T.goal, T.focus[q.f]]);
    rows.push([T.days, dayText]);
    rows.push([T.time, q.m ? q.m + ' min' : T.auto]);
    var sk = list('s', T.sk);
    if (sk.length) rows.push([T.skills, sk.join(', ')]);
    var gear = list('e', T.eq);
    if (q.w === '1') gear.push(T.weight);
    rows.push([T.gear, gear.length ? gear.join(', ') : T.none]);
  } else {
    rows.push([T.type, T.starter]);
    rows.push([T.days, dayText]);
    if (q.len) rows.push([T.time, q.len + ' min']);
    if (T.cd[q.c]) rows.push([T.cardio, T.cd[q.c]]);
    if (q.k === '1') rows.push([T.knees, T.yes]);
  }
  $('rows').innerHTML = rows.map(function (r) {
    return '<div class="row"><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>';
  }).join('');
  $('note').textContent = T.note;

  // Otwieranie aplikacji: Android – intent:// (Chrome, karta w WhatsApp/Messengerze); bez aplikacji – powrót tu z ?noapp=1
  var android = /android/i.test(navigator.userAgent);
  var back = location.origin + location.pathname + '?noapp=1' + (pl ? '' : '&lang=en') + '#' + raw;
  var open = $('open');
  open.textContent = T.open;
  if (android) {
    open.href = 'intent://plan?' + raw + '#Intent;scheme=fitnessflow;package=pl.fouroptima.fitnessflow;S.browser_fallback_url=' + encodeURIComponent(back) + ';end';
  } else {
    open.href = 'fitnessflow://plan?' + raw;
  }
  $('get').textContent = T.get;
  $('steps').innerHTML = T.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('');

  var noapp = $('noapp');
  if (new URLSearchParams(location.search).get('noapp') === '1') { noapp.innerHTML = T.noapp; noapp.classList.remove('hidden'); }
  else if (!android) { noapp.innerHTML = T.desktop; noapp.classList.remove('hidden'); open.classList.add('hidden'); }

  $('plan').classList.remove('hidden');
})();
</script>
</body>
</html>
